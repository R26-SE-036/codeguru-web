# Test every push; deploy what reaches main to the AWS server.
#
#   push / pull request to dev or main  ->  unit tests and type check
#   push to main (after they pass)      ->  build the arm64 image, push it to
#                                           ECR, and roll web on the EC2 host
#
# AWS access is OpenID Connect: GitHub proves which repository and branch the
# run is for, and AWS hands back credentials for about an hour. No access keys
# are stored here. The role (vars.AWS_DEPLOY_ROLE_ARN) trusts only the main
# branch of the five Code Guru repositories, and on the host it may run one
# thing - the codeguru-deploy SSM document, which takes a service name and a
# commit SHA and nothing else.
#
# What this does NOT deploy: the server's own configuration - deploy/aws's
# compose file, deploy/Caddyfile, deploy-service.sh and the env files. Those
# change rarely, carry the credentials, and a mistake in them takes down all
# eight services rather than one, so they are copied to the host by hand.
name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    name: Test - unit and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  build:
    name: Build web
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # The server is arm64 (t4g), so the image is built on an arm64 runner
    # rather than emulated. (While this repository was private it had to use
    # QEMU on x86, since GitHub's arm64 runners are free only for public
    # repositories - `next build` under emulation took most of ten minutes.)
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/codeguru/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to AWS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll the service on the server
        run: |
          service=web
          id=$(aws ssm send-command --document-name codeguru-deploy --instance-ids "$INSTANCE_ID" \
            --parameters "{\"service\":[\"$service\"],\"tag\":[\"$GITHUB_SHA\"]}" \
            --comment "$GITHUB_REPOSITORY@${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          if [ "$status" != Success ]; then
            echo "::error::$service was not deployed ($status); the server kept the previous image"
            exit 1
          fi
      - name: Check the public site answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ vars.PUBLIC_URL }}/login")
          echo "GET ${{ vars.PUBLIC_URL }}/login -> $code"
          [ "$code" = 200 ]
