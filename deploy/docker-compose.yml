# The whole platform, one command.
#
#   cd codeguru-web/deploy
#   docker compose build          # first time, or after a code change
#   docker compose up -d
#   open http://localhost:8080
#
# ── What this replaces ───────────────────────────────────────────────────────
# Seven terminals, each with a different runtime, a different start command and
# a different .env, started in an order nobody wrote down. Getting one wrong
# produced a symptom in a different service - which is how PairPath spent
# months posting feature vectors at Code Coach's port.
#
# ── Why only Caddy publishes a port ──────────────────────────────────────────
# The browser talks to exactly two things: the web app, and PairPath's socket.
# Every other backend call goes through the BFF, server-side, so the backends
# need to be reachable from codeguru-web and from nowhere else. The one
# exception is the VS Code extension, which is not a browser and has no BFF: it
# calls Code Coach's /api/v1 with its own token, so Caddy routes that path too. They are on the
# internal network with no `ports:` mapping, which means they are not reachable
# from the host at all - the same posture as a private subnet, minus the VPC.
#
# That is also why there is no CORS configuration anywhere below. One origin.
#
# ── Costs this avoids ────────────────────────────────────────────────────────
# Caddy does TLS and path routing, which is the entire job an ALB was going to
# do for ~$16/month billed hourly whether anyone is using it. The four
# databases are already free managed tiers - Neon, Neo4j Aura and two Atlas
# clusters - so nothing here needs RDS or ElastiCache either.
#
# ── Deploying this ───────────────────────────────────────────────────────────
# On a server you do not build: push the images to a registry, replace the
# `build:` blocks with the registry tags, put the env files beside this
# compose file, and set CADDY_SITE to the real hostname so Caddy provisions a
# certificate. Everything else is identical.

name: codeguru

x-restart: &restart
  restart: unless-stopped

# ── Readiness, not liveness ──────────────────────────────────────────────────
# `depends_on` on its own waits for a container to START, which is not the same
# as being able to answer. On the first `docker compose up` the API container
# reported itself started, Prisma logged
#
#     Can't reach database server at ...neon.tech:5432   errorCode: P1001
#
# because Neon suspends a serverless Postgres after inactivity and takes several
# seconds to wake - and a login five seconds later returned 503. Nothing was
# broken; the stack simply began accepting traffic before it could serve it.
#
# So every service is probed, and everything downstream waits for
# `condition: service_healthy`. start_period covers the slow first connection
# without counting those attempts as failures.
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

# node:*-alpine has busybox wget and no curl.
x-wget: &wget
  <<: *health

# python:*-slim has neither, so the probe uses the interpreter that is already
# there rather than installing a package into a runtime image for one check.
x-pyget: &pyget
  <<: *health

services:
  # ── Edge ──────────────────────────────────────────────────────────────────
  caddy:
    <<: *restart
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      # ":80" locally. A hostname in production, which is what makes Caddy
      # fetch a Let's Encrypt certificate automatically.
      CADDY_SITE: "${CADDY_SITE:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  # ── Web tier / BFF ────────────────────────────────────────────────────────
  web:
    <<: *restart
    build:
      context: ../
      dockerfile: Dockerfile
    image: codeguru-web:local
    env_file: [../.env.local]
    environment:
      # Service names, not 127.0.0.1. These override whatever the env file says
      # precisely because that file is written for running on the host.
      CODE_COACH_URL: http://code-coach:8080
      STUDY_GUIDER_URL: http://study-guider:8010
      PAIRPATH_URL: http://pairpath-api:3001
      GAMIFICATION_URL: http://gamification-api:3002
      # Deliberately blank. Set, it makes the browser connect straight to
      # PairPath and bypass the edge; empty means same-origin through Caddy,
      # which is the whole point of routing /pair-ws/* below.
      NEXT_PUBLIC_PAIR_WS_URL: ""
    healthcheck:
      <<: *wget
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200/login"]
    depends_on:
      code-coach: {condition: service_healthy}
      study-guider: {condition: service_healthy}
      pairpath-api: {condition: service_healthy}
      gamification-api: {condition: service_healthy}

  # ── Identity provider and diagnostics store ───────────────────────────────
  # Everything else verifies its tokens here, so everything else waits for it.
  code-coach:
    <<: *restart
    build:
      context: ../../code-coach
      dockerfile: Dockerfile
    image: code-coach:local
    env_file: [../../code-coach/backend/.env]
    healthcheck:
      <<: *pyget
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]

  # ── Study Guider ──────────────────────────────────────────────────────────
  study-guider:
    <<: *restart
    build:
      context: ../../Study-Guider/backend
      dockerfile: Dockerfile
    image: study-guider:local
    env_file: [../../Study-Guider/backend/.env]
    environment:
      CODE_COACH_URL: http://code-coach:8080
    healthcheck:
      <<: *pyget
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health')"]
    depends_on:
      code-coach: {condition: service_healthy}

  # ── PairPath ──────────────────────────────────────────────────────────────
  pairpath-api:
    <<: *restart
    build:
      context: ../../Pair_Path/backend
      dockerfile: Dockerfile
      args:
        # Puts javac in the image. Off in the Dockerfile's default because a
        # deployment runs student code in the Lambda and needs no compiler;
        # on here because a container has no Docker daemon and a laptop has no
        # Lambda, so this stack has nowhere else to run it.
        INCLUDE_JDK: "true"
    image: pairpath-api:local
    env_file: [../../Pair_Path/backend/.env]
    environment:
      CODE_COACH_URL: http://code-coach:8080
      ML_SERVICE_URL: http://pairpath-ml:8000
      # ============ WHY THIS STACK IS NOT "production" ============
      # The image sets NODE_ENV=production; this overrides it, deliberately.
      #
      # .env carries CODE_RUNNER_ALLOW_UNSANDBOXED=true, which runs student
      # Java in this container with the API's own permissions - including read
      # access to the credentials in that same .env. The API refuses to start
      # at all when that flag is set with NODE_ENV=production, which is what
      # stopped this stack booting the first time it was built after the check
      # was added. The check is right: this is a demonstration stack on one
      # machine, not a deployment, and saying so is more honest than relaxing
      # the rule that says so.
      #
      # A real deployment sets CODE_RUNNER_LAMBDA_FUNCTION and leaves
      # NODE_ENV=production, and the flag never travels with it.
      # ============================================================
      NODE_ENV: development
      # Same-origin through Caddy, so the only origin the browser ever uses is
      # the edge's. Kept explicit rather than removed: the API still reads it.
      CORS_ORIGINS: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      # Redis is not in this stack. Its only live use is intervention
      # cooldowns, and the service falls back to an in-process map - which is
      # correct here, because PairPath has no Socket.IO adapter and therefore
      # cannot run as more than one instance anyway.
      REDIS_URL: ""
    # /health queries the database, so "healthy" here means Neon has woken up
    # and this service can actually serve a request - see health.controller.ts.
    healthcheck:
      <<: *wget
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
    depends_on:
      code-coach: {condition: service_healthy}
      pairpath-ml: {condition: service_healthy}

  pairpath-ml:
    <<: *restart
    build:
      context: ../../Pair_Path/backend/ml
      dockerfile: Dockerfile
    image: pairpath-ml:local
    healthcheck:
      <<: *pyget
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]

  # ── Gamification ──────────────────────────────────────────────────────────
  gamification-api:
    <<: *restart
    build:
      context: ../../adaptive-gamification-engine/backend
      dockerfile: Dockerfile
    image: gamification-api:local
    env_file: [../../adaptive-gamification-engine/backend/.env]
    environment:
      CODE_COACH_URL: http://code-coach:8080
      ML_SERVICE_URL: http://gamification-ml:5000
      # FR-12: the engine transmits a summary of every completed round to the
      # Progress Tracker. Without this it would fall back to the localhost
      # default and log a failed transmission after every game.
      STUDY_GUIDER_URL: http://study-guider:8010
    healthcheck:
      <<: *wget
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
    depends_on:
      code-coach: {condition: service_healthy}
      gamification-ml: {condition: service_healthy}
      study-guider: {condition: service_healthy}

  # Serves the difficulty model, and can refit it from the game sessions in
  # Mongo. It had no environment at all, which meant two things silently: the
  # trainer could not reach the database (it falls back to reading backend/.env,
  # which is deliberately not in the image), and RETRAIN_SECRET was unset - so
  # POST /retrain answered 403 to everyone, including whoever was meant to use
  # it. Both are inherited from the backend's .env rather than restated here.
  gamification-ml:
    <<: *restart
    build:
      context: ../../adaptive-gamification-engine/backend/ml
      dockerfile: Dockerfile
    image: gamification-ml:local
    env_file: [../../adaptive-gamification-engine/backend/.env]
    environment:
      # The backend's .env also carries PORT=3002 for the Node service, which
      # would move this one off the port gamification-api is pointed at.
      PORT: "5000"
    healthcheck:
      <<: *pyget
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]

# The code runner is NOT here. It is a Lambda container image, and running it
# beside everything else would put student-submitted Java on the same host as
# the identity provider - which is the isolation the Lambda exists to provide.
# See Pair_Path/code-runner-lambda.

volumes:
  caddy_data:
  caddy_config:
